name: Validate add-on

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint jq
      - name: ShellCheck
        run: shellcheck minecraft-java/rootfs/usr/local/bin/ha-minecraft minecraft-java/rootfs/usr/local/lib/ha-minecraft/*.sh tests/*.sh
      - name: YAML lint
        run: yamllint repository.yaml minecraft-java/config.yaml minecraft-java/build.yaml .github/workflows/validate.yml
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: minecraft-java/Dockerfile
      - name: Unit tests
        run: bash tests/run.sh
      - name: Home Assistant add-on config smoke check
        run: python3 tests/validate_config.py

  build-amd64:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Docker build smoke test
        run: docker build --build-arg BUILD_FROM=itzg/minecraft-server:2026.7.0 --build-arg MC_IMAGE_TAG=2026.7.0 -t ha-minecraft-java:test minecraft-java
