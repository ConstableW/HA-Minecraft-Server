  grim_enabled: bool
  grim_auto_update: bool
  grim_auto_compatible_beta: bool
  grim_update_channel: list(stable|beta)
  grim_punishments_managed: bool
  grim_public_alerts: bool
  grim_public_alert_threshold: int(1,)
  grim_public_alert_interval: int(1,)
  grim_kick_enabled: bool
  grim_kick_threshold: int(1,)
  grim_event_log_enabled: bool
  grim_event_log_max_entries: int(50,5000)
  xray_suspicion_enabled: bool
  xray_suspicion_alert_threshold: int(10,500)
