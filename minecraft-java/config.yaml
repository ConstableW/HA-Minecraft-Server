  xray_suspicion_rcon_alerts: bool
  xray_suspicion_alert_cooldown_seconds: int(30,3600)
  xray_suspicion_rcon_save_before_scan: bool
  plugins_enabled: bool
  plugin_preset: list(MANUAL|NONE|BEDROCK_GEYSER|TPA_ESSENTIALSX|FAMILY_STARTER|VOICE_CHAT|MAP_BLUEMAP|PERMISSIONS_LUCKPERMS)
  modrinth_plugins: str?
  plugin_urls: str?
  plugin_browser_enabled: bool?
  ingress_admin_password: password?
  ingress_admin_users: str?
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: int(1,65535)?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_discovery_prefix: str?
  mqtt_topic_prefix: str?
  mqtt_status_interval: int(5,3600)?
  playit_enabled: bool?
  playit_secret: password?
  playit_public_address: str?
  remove_old_plugins: bool?
  enforce_whitelist: bool?
  allow_flight: bool?
  enable_rcon: bool
  rcon_password: password?
  rcon_port: int(1,65535)?
  rcon_message_stop_announcement: bool?
  rcon_message_stop_save: bool?
  rcon_message_backup_save: bool?
  server_port: int(1,65535)?
  timezone: str?
