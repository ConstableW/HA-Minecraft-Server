  autopause_timeout_seconds: int(60,86400)?
  enable_auto_backup: bool
  backup_interval_hours: int(1,168)?
  backup_retention_days: int(1,365)?
  backup_min_interval_minutes: int(0,1440)?
  backup_keep_last: int(0,500)?
  backup_on_shutdown: bool
  backup_on_world_switch: bool?
  backup_on_start: bool?
  stop_grace_period_seconds: int(30,600)?
  idle_shutdown_minutes: int(1,1440)?
